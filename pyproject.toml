[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frontline"
version = "0.1.0"
description = "AI-scored daily newspaper from your RSS feeds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Marshall Yanis", email = "marshall.e.yanis@gmail.com"}]

dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
embeddings = ["fastembed>=0.3"]
ollama = ["ollama>=0.2"]
all = ["frontline[claude,embeddings,ollama]"]
dev = ["pytest>=8.0"]

[project.scripts]
frontline = "frontline.cli:main"

[tool.setuptools.packages.find]
include = ["frontline*"]
